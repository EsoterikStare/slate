name: Release

# HACS installs dashboard plugins from a release asset named like hacs.json's
# "filename", so attach the built bundle to every published release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/wall-cards.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
