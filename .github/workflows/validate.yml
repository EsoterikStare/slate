name: HACS validation

# HACS's own checks for a dashboard ("plugin") repository. Required to pass,
# with nothing ignored, before the repo can be submitted to the HACS default
# store; for now it flags problems early. `images` is ignored until the README
# has screenshots (needed for the default store, not for custom repositories).
#
# Advisory for now: the validator looks for slate.js on the latest release
# that is *not* a pre-release, and checks the repo's description and topics.
# Remove `continue-on-error` once a run passes with a regular release and the
# topics in place.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: images
