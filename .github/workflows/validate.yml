name: HACS validation

# HACS's own checks for a dashboard ("plugin") repository. Required to pass,
# with nothing ignored, before the repo can be submitted to the HACS default
# store; for now it flags problems early. `images` is ignored until the README
# has screenshots (needed for the default store, not for custom repositories).
#
# Advisory during the alpha: the validator looks for slate.js on the latest
# release that is *not* a pre-release, and every alpha is a pre-release, so it
# reports "Repository structure ... is not compliant" until the first full
# release. Remove `continue-on-error` once that release exists.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: images
